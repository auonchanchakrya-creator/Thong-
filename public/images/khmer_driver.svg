<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="driverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="khmerDriverSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c98a54"/>
      <stop offset="100%" stop-color="#b4743e"/>
    </linearGradient>
    <!-- Cambodian Krama Red-White Check Pattern -->
    <pattern id="kramaPattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#dc2626"/>
      <rect x="0" y="0" width="5" height="5" fill="#f8fafc"/>
      <rect x="5" y="5" width="5" height="5" fill="#f8fafc"/>
      <path d="M 0 5 L 10 5 M 5 0 L 5 10" stroke="#b91c1c" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#driverBg)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#34d399" stroke-width="2" opacity="0.4"/>

  <!-- Bus outline silhouette in background -->
  <g opacity="0.12" fill="#ffffff">
    <rect x="130" y="45" width="40" height="25" rx="5"/>
    <circle cx="140" cy="70" r="5"/>
    <circle cx="160" cy="70" r="5"/>
  </g>

  <!-- Shoulders with Transit Driver Uniform (Sky Blue with Epaulets) -->
  <path d="M 30 200 C 30 152, 60 140, 100 140 C 140 140, 170 152, 170 200 Z" fill="#0284c7"/>
  
  <!-- Traditional Cambodian Krama Scarf neatly draped around collar -->
  <path d="M 72 144 C 82 165, 95 185, 100 188 C 105 185, 118 165, 128 144 L 118 140 C 110 158, 104 170, 100 172 C 96 170, 90 158, 82 140 Z" fill="url(#kramaPattern)"/>
  <rect x="96" y="172" width="8" height="28" fill="url(#kramaPattern)"/>

  <!-- Neck -->
  <rect x="85" y="110" width="30" height="36" rx="4" fill="#a46532"/>

  <!-- Face Contour (Warm, tanned friendly Khmer driver) -->
  <ellipse cx="100" cy="90" rx="37" ry="42" fill="url(#khmerDriverSkin)"/>

  <!-- Ears -->
  <ellipse cx="62" cy="90" rx="6" ry="11" fill="#b4743e"/>
  <ellipse cx="138" cy="90" rx="6" ry="11" fill="#b4743e"/>

  <!-- Eyes - Friendly, reliable, warm smile creases -->
  <ellipse cx="84" cy="86" rx="8" ry="5" fill="#ffffff"/>
  <circle cx="85" cy="86" r="4" fill="#1c1917"/>
  <circle cx="83.5" cy="84.5" r="1.5" fill="#ffffff"/>
  <path d="M 74 85 Q 84 81 94 85" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Smile crinkles -->
  <path d="M 73 88 Q 70 90 73 92" stroke="#8a4f22" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <ellipse cx="116" cy="86" rx="8" ry="5" fill="#ffffff"/>
  <circle cx="115" cy="86" r="4" fill="#1c1917"/>
  <circle cx="113.5" cy="84.5" r="1.5" fill="#ffffff"/>
  <path d="M 106 85 Q 116 81 126 85" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 127 88 Q 130 90 127 92" stroke="#8a4f22" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Eyebrows - Expressive & Friendly -->
  <path d="M 73 76 Q 84 72 95 77" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 105 77 Q 116 72 127 76" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Broad Southeast Asian nose -->
  <path d="M 100 80 Q 97 97 93 101 Q 100 106 107 101 Q 103 97 100 80" fill="#a46532"/>

  <!-- Big, kind, confident smile -->
  <path d="M 86 114 Q 100 128 114 114" stroke="#881337" stroke-width="3" stroke-linecap="round" fill="#e11d48"/>
  <path d="M 88 114 Q 100 120 112 114" fill="#ffffff"/>

  <!-- Short, neat, classic Khmer haircut -->
  <path d="M 62 80 C 60 48, 76 36, 100 36 C 124 36, 140 48, 138 80 C 132 58, 120 50, 100 50 C 80 50, 68 58, 62 80 Z" fill="#0f172a"/>
  <!-- Sideburns -->
  <rect x="62" y="76" width="5" height="15" rx="2" fill="#0f172a"/>
  <rect x="133" y="76" width="5" height="15" rx="2" fill="#0f172a"/>
</svg>
