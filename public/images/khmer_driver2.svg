<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="driver2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="khmerDriver2Skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4834e"/>
      <stop offset="100%" stop-color="#ae6e3b"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#driver2Bg)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.4"/>

  <!-- Shoulders with Navy Transit Driver Shirt -->
  <path d="M 30 200 C 30 152, 60 140, 100 140 C 140 140, 170 152, 170 200 Z" fill="#1e293b"/>
  <!-- Driver collar with yellow safety border -->
  <path d="M 82 140 L 100 168 L 118 140 Z" fill="#f59e0b"/>
  <path d="M 87 140 L 100 162 L 113 140 Z" fill="#ffffff"/>

  <!-- Neck -->
  <rect x="85" y="110" width="30" height="36" rx="4" fill="#9e6234"/>

  <!-- Face Contour -->
  <ellipse cx="100" cy="90" rx="36" ry="41" fill="url(#khmerDriver2Skin)"/>

  <!-- Ears -->
  <ellipse cx="63" cy="90" rx="6" ry="10" fill="#ae6e3b"/>
  <ellipse cx="137" cy="90" rx="6" ry="10" fill="#ae6e3b"/>

  <!-- Eyes with friendly focus -->
  <ellipse cx="85" cy="86" rx="7.5" ry="5" fill="#ffffff"/>
  <circle cx="86" cy="86" r="3.8" fill="#18181b"/>
  <circle cx="84.5" cy="84.5" r="1.5" fill="#ffffff"/>
  <path d="M 75 84 Q 85 80 94 84" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <ellipse cx="115" cy="86" rx="7.5" ry="5" fill="#ffffff"/>
  <circle cx="114" cy="86" r="3.8" fill="#18181b"/>
  <circle cx="112.5" cy="84.5" r="1.5" fill="#ffffff"/>
  <path d="M 106 84 Q 115 80 125 84" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Eyebrows -->
  <path d="M 74 76 Q 84 72 95 77" stroke="#09090b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 105 77 Q 116 72 126 76" stroke="#09090b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M 100 82 Q 97 97 94 101 Q 100 105 106 101 Q 103 97 100 82" fill="#9e6234"/>

  <!-- Smile -->
  <path d="M 87 114 Q 100 126 113 114" stroke="#881337" stroke-width="3" stroke-linecap="round" fill="#e11d48"/>
  <path d="M 89 114 Q 100 119 111 114" fill="#ffffff"/>

  <!-- Driver Cap (Blue with Golden Emblem) -->
  <path d="M 60 72 C 60 44, 76 34, 100 34 C 124 34, 140 44, 140 72 Z" fill="#0369a1"/>
  <path d="M 52 72 Q 100 78 148 72 C 146 66, 54 66, 52 72 Z" fill="#0f172a"/>
  <!-- Gold Badge -->
  <circle cx="100" cy="52" r="6" fill="#fbbf24"/>
  <polygon points="100,48 102,54 97,50 103,50 98,54" fill="#d97706"/>
</svg>
