<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="khmerSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d99b66"/>
      <stop offset="100%" stop-color="#c4834e"/>
    </linearGradient>
    <linearGradient id="silkPattern" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Circle with gentle glow -->
  <circle cx="100" cy="100" r="100" fill="url(#adminBg)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.4"/>

  <!-- Subtle Traditional Khmer Romduol / Floral geometric background motif -->
  <g opacity="0.12" fill="#ffffff">
    <circle cx="40" cy="50" r="8"/>
    <circle cx="160" cy="50" r="8"/>
    <circle cx="50" cy="40" r="8"/>
    <circle cx="150" cy="40" r="8"/>
  </g>

  <!-- Shoulders & Professional Formal Khmer Attire -->
  <path d="M 30 200 C 30 155, 65 142, 100 142 C 135 142, 170 155, 170 200 Z" fill="#1e293b"/>
  <!-- Elegant Golden Khmer Silk Trim Collar / Sbai inspired neckpiece -->
  <path d="M 75 145 L 100 178 L 125 145 L 115 143 L 100 165 L 85 143 Z" fill="url(#silkPattern)"/>
  <polygon points="100,165 92,185 100,195 108,185" fill="#f59e0b"/>

  <!-- Neck -->
  <rect x="86" y="112" width="28" height="34" rx="4" fill="#b87542"/>
  <path d="M 86 128 C 94 135, 106 135, 114 128" stroke="#a36030" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Face Contour (Authentic Southeast Asian / Khmer features) -->
  <ellipse cx="100" cy="92" rx="36" ry="40" fill="url(#khmerSkin)"/>

  <!-- Ears & Gold Stud Earrings -->
  <ellipse cx="63" cy="94" rx="6" ry="10" fill="#c4834e"/>
  <circle cx="63" cy="97" r="3" fill="#fbbf24"/>
  <ellipse cx="137" cy="94" rx="6" ry="10" fill="#c4834e"/>
  <circle cx="137" cy="97" r="3" fill="#fbbf24"/>

  <!-- Eyes - Almond shaped, warm and expressive -->
  <!-- Left Eye -->
  <ellipse cx="85" cy="88" rx="8" ry="5.5" fill="#ffffff"/>
  <circle cx="86" cy="88" r="4.2" fill="#1c1917"/>
  <circle cx="84.5" cy="86.5" r="1.5" fill="#ffffff"/>
  <path d="M 76 84 Q 85 80 94 84" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Right Eye -->
  <ellipse cx="115" cy="88" rx="8" ry="5.5" fill="#ffffff"/>
  <circle cx="114" cy="88" r="4.2" fill="#1c1917"/>
  <circle cx="112.5" cy="86.5" r="1.5" fill="#ffffff"/>
  <path d="M 106 84 Q 115 80 124 84" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Soft Eyebrows -->
  <path d="M 74 78 Q 85 74 95 78" stroke="#111827" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 105 78 Q 115 74 126 78" stroke="#111827" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M 100 85 Q 98 98 96 102 Q 100 105 104 102 Q 102 98 100 85" fill="#b5733f"/>

  <!-- Warm, Welcoming Smile -->
  <path d="M 88 114 Q 100 124 112 114" stroke="#be123c" stroke-width="3" stroke-linecap="round" fill="#fda4af"/>
  <path d="M 90 114 Q 100 118 110 114" fill="#ffffff"/>

  <!-- Cheerful Rosy Blush -->
  <circle cx="77" cy="100" r="6" fill="#e11d48" opacity="0.18"/>
  <circle cx="123" cy="100" r="6" fill="#e11d48" opacity="0.18"/>

  <!-- Hair - Neat Khmer High Bun with Jasmine / Golden Brooch Hairpin -->
  <path d="M 64 88 C 64 52, 78 40, 100 40 C 122 40, 136 52, 136 88 C 136 74, 128 58, 100 58 C 72 58, 64 74, 64 88 Z" fill="#0f172a"/>
  <!-- Top Bun -->
  <ellipse cx="100" cy="38" rx="26" ry="18" fill="#0f172a"/>
  <!-- Golden Khmer Flower Hairpin (Phka Romduol) -->
  <circle cx="118" cy="36" r="6" fill="#f59e0b"/>
  <circle cx="118" cy="36" r="3" fill="#fef08a"/>
  <circle cx="114" cy="32" r="3" fill="#fef08a" opacity="0.8"/>
  <circle cx="122" cy="32" r="3" fill="#fef08a" opacity="0.8"/>
</svg>
